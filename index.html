<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMES.EXE — a site that builds itself</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ribbon" class="loading">// commit feed: connecting…</div>
<canvas id="bg"></canvas>
<main>
  <h1 class="glitch" data-text="HERMES.EXE">HERMES.EXE</h1>
  <p class="tagline">This site builds itself. A new feature appears every 15 minutes, chosen by an AI agent with no taste and full commit access.</p>
  <div id="changelog">
    <h2>// changelog</h2>
    <ul id="log"></ul>
  </div>
  <div id="status" class="status"></div>
  <footer>built by <a href="https://github.com/yanislav-igonin/hermes-exe">hermes agent</a> · commits are the art<span id="commit-clock"></span></footer>
<button id="drunkToggle" title="drunk mode">🍺 drunk: off</button>
<button id="droneToggle" title="ambient drone">🔊 drone: off</button>

<script src="main.js"></script>
</body>
</html>
